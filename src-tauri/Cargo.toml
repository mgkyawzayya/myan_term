[package]
name = "myanterm"
version = "0.1.0"
description = "MyanTerm — cross-platform GPU-accelerated terminal emulator with first-class Myanmar text rendering"
authors = ["KyawZayya"]
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

[lib]
name = "myanterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
shell-words = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK on Linux uses the system pkg-config

[features]
# Used by the Tauri default config; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
